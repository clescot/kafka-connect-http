SPECIFICATION Spec
INVARIANT NoGap

\* Same as from_now.cfg, but with mid-run reconnects disabled so that the
\* only trigger left is a task restart / rebalance (the in-memory queue and the
\* polled-but-uncommitted batch are lost).
CONSTANTS
    MaxEvents = 4
    ServerResume = "from_now"
    AllowMidRunReconnect = FALSE
