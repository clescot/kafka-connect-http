name: release and publish to central.sonatype.com and github releases
on:
  push:
    branches:
      - master
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # a full clone: the release plugin pushes a tag and two commits, and re-runs need to see the
      # tag a previous attempt already created
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17 for central.sonatype.com
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: 'central'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Configure Git user
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "clescot"

      # Maven 3.10 (the runner's default) leaves maven-metadata-local.xml at the artifact level of
      # the Central staging directory, and Central rejects the bundle with "content that does NOT
      # have a .pom file: io/github/clescot/<artifactId>". central-publishing-maven-plugin 0.10.0
      # has no fix for it, so pin the Maven that writes the bundle.
      - name: Use Maven 3.9
        run: |
          set -euo pipefail
          MAVEN_VERSION=3.9.16
          MAVEN_DIR="/opt/apache-maven-${MAVEN_VERSION}"
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | sudo tar -xz -C /opt
          echo "${MAVEN_DIR}/bin" >> "$GITHUB_PATH"
          "${MAVEN_DIR}/bin/mvn" -v

      # A failure here must not stop the GitHub release: `release:prepare` has already created and
      # pushed the tag, and the connector ZIP is the artifact users download. The run still fails,
      # at the end, so a Central problem stays visible.
      - name: Publish to the Maven Central Repository via central.sonatype.com
        id: central
        continue-on-error: true
        # tee keeps the deployment id the plugin prints, so the failure can name its own reason
        run: |
          set -o pipefail
          mvn -B release:prepare release:perform -e -PsonatypeDeploy --no-transfer-progress  -Dmaven.test.skip=true  deploy  -DskipNexusStagingDeployMojo=true 2>&1 | tee central-release.log
        env:
          MAVEN_USERNAME: "${{ secrets.NEXUS_USERNAME }}"
          MAVEN_PASSWORD: "${{ secrets.NEXUS_PASSWORD }}"
          MAVEN_GPG_KEY: "${{ secrets.MAVEN_GPG_KEY }}"
          MAVEN_GPG_KEY_ID: "${{ secrets.MAVEN_GPG_KEY_ID }}"
          MAVEN_GPG_PASSPHRASE: "${{ secrets.MAVEN_GPG_PASSPHRASE }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MAVEN_OPTS: " -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn "

      # The plugin only reports "Deployment <id> failed". The Publisher API returns the validation
      # errors for that id, so print them here: the build log then says why Central rejected it.
      - name: Explain the Central publish failure
        if: steps.central.outcome == 'failure'
        env:
          NEXUS_USERNAME: "${{ secrets.NEXUS_USERNAME }}"
          NEXUS_PASSWORD: "${{ secrets.NEXUS_PASSWORD }}"
        run: |
          set -euo pipefail
          # -a: the captured Maven log contains binary bytes, and without it grep only says
          #     "binary file matches" instead of printing the match
          # -m1: stop at the first match, so no head/pipefail SIGPIPE race
          DEPLOYMENT="$(grep -a -m1 -oE 'Deployment [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' central-release.log | cut -d' ' -f2 || true)"
          if [ -z "$DEPLOYMENT" ]; then
            echo "::warning::no deployment id in the release log: the job failed before uploading to Central"
            exit 0
          fi
          echo "deployment: $DEPLOYMENT"
          TOKEN="$(printf '%s:%s' "$NEXUS_USERNAME" "$NEXUS_PASSWORD" | base64 -w0)"
          RESPONSE="$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" \
            "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT" || true)"
          echo "$RESPONSE" | jq '{deploymentState, errors}' 2>/dev/null || echo "$RESPONSE"
          if echo "$RESPONSE" | jq -e '.errors | length > 0' > /dev/null 2>&1; then
            echo "::error::Maven Central rejected deployment $DEPLOYMENT, see the errors above"
          else
            echo "::warning::Central returned no error detail for $DEPLOYMENT; see https://central.sonatype.com/publishing/deployments"
          fi

      # `release:prepare` tags the release commit and then commits the next SNAPSHOT version on top
      # of it, so the nearest tag from HEAD is the released version, whether the bump committed or
      # the release failed before it.
      - name: Read the released tag
        id: tag
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --abbrev=0 HEAD)"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "released tag: $TAG"

      # `release:prepare` packages the release version (its preparationGoals), but a release that
      # fails early leaves no artifacts behind; rebuild them from the tag so the GitHub release
      # always carries the files of the version it names.
      - name: Rebuild the release artifacts when the release did not produce them
        if: steps.central.outcome == 'failure'
        run: |
          set -euo pipefail
          git checkout --force "${{ steps.tag.outputs.TAG }}"
          mvn -B -DskipTests -DskipITs --no-transfer-progress package

      - name: Assert the release artifacts exist
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.TAG }}"
          missing=0
          for pattern in \
            "http-core/target/*-${TAG}.jar" \
            "http-client/target/*-${TAG}.jar" \
            "kafka-connect-http-connectors/target/components/packages/*-${TAG}.zip"; do
            if compgen -G "$pattern" > /dev/null; then
              echo "found $pattern"
            else
              echo "missing release artifact: $pattern" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Publish the GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.TAG }}
          artifacts: "http-core/target/*-${{ steps.tag.outputs.TAG }}.jar,http-client/target/*-${{ steps.tag.outputs.TAG }}.jar,kafka-connect-http-connectors/target/components/packages/*-${{ steps.tag.outputs.TAG }}.zip"
          artifactErrorsFailBuild: true
          skipIfReleaseExists: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail when the Central publish failed
        if: steps.central.outcome == 'failure'
        run: |
          echo "::error::the Maven Central publish failed; the GitHub release was published anyway (see the deployment in central.sonatype.com)"
          exit 1
